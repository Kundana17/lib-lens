[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "liblens"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "streamlit",
    "supabase",
    "requests",
    "google-genai",
    "python-dotenv",
    "packaging",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
